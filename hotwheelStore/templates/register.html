{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · HotWheels</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #FF1A1A;
  --red-glow: rgba(255,26,26,0.4);
  --red-dim: rgba(255,26,26,0.10);
  --glass-bg: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
  --muted: rgba(255,255,255,0.45);
  --font-head: 'Bebas Neue', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
}

html, body {
  height: 100%;
  background: #000;
  color: #fff;
  font-family: var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── GRAIN ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1; opacity: 0.45;
}

/* ── CURSOR ── */
#cursor-glow {
  position: fixed; width: 360px; height: 360px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,26,26,0.25) 0%, rgba(255,26,26,0.08) 40%, transparent 70%);
  pointer-events: none; z-index: 9998; top: 0; left: 0;
  will-change: transform; transform: translate(-180px,-180px);
}
#cursor-dot {
  position: fixed; width: 6px; height: 6px; border-radius: 50%;
  background: var(--red); pointer-events: none; z-index: 9999;
  top: 0; left: 0; will-change: transform; transform: translate(-3px,-3px);
  box-shadow: 0 0 8px var(--red);
  transition: width .2s, height .2s, opacity .2s;
}

/* ── GRID LINES BG ── */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(255,26,26,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,26,26,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 48px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
}
.nav-logo {
  font-family: var(--font-head); font-size: 24px;
  letter-spacing: 4px; color: var(--red); text-decoration: none;
  text-shadow: 0 0 20px rgba(255,26,26,0.5);
}
.nav-back {
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); text-decoration: none;
  display: flex; align-items: center; gap: 8px;
  transition: color .3s;
}
.nav-back:hover { color: #fff; }

/* ── LAYOUT ── */
.page {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 100px 24px 60px;
}

/* ── CARD ── */
.card {
  width: 100%; max-width: 500px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 4px;
  padding: 52px 48px;
  position: relative;
  overflow: hidden;
  opacity: 0; transform: translateY(30px);
  animation: fadeUp .8s .2s cubic-bezier(.4,0,.2,1) forwards;
}

/* Top red line */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--red) 50%, transparent);
}

/* Corner accents */
.card::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 80px; height: 80px;
  border-bottom: 1px solid rgba(255,26,26,0.2);
  border-right: 1px solid rgba(255,26,26,0.2);
  border-radius: 0 0 4px 0;
}

.card-eyebrow {
  font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
  color: var(--red); margin-bottom: 10px;
}
.card-title {
  font-family: var(--font-head); font-size: 52px;
  letter-spacing: 4px; line-height: 1; margin-bottom: 36px;
}

/* ── MESSAGES ── */
.msg {
  padding: 12px 16px; border-radius: 2px; margin-bottom: 20px;
  font-size: 13px; letter-spacing: 1px; font-weight: 600;
}
.msg-error {
  background: rgba(255,26,26,0.1);
  border: 1px solid rgba(255,26,26,0.3);
  color: #ff6b6b;
}
.msg-success {
  background: rgba(0,255,100,0.06);
  border: 1px solid rgba(0,255,100,0.2);
  color: #4ade80;
}

/* ── FORM ── */
.form-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin-bottom: 16px;
}
.form-group {
  display: flex; flex-direction: column; gap: 7px;
  margin-bottom: 16px;
}
.form-group.half { margin-bottom: 0; }

label {
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}

input {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 2px;
  padding: 13px 16px;
  color: #fff;
  font-family: var(--font-body); font-size: 15px; font-weight: 600;
  letter-spacing: 1px;
  outline: none;
  transition: border-color .3s, background .3s, box-shadow .3s;
  width: 100%;
}
input::placeholder { color: rgba(255,255,255,0.2); font-weight: 400; }
input:focus {
  border-color: rgba(255,26,26,0.5);
  background: rgba(255,26,26,0.04);
  box-shadow: 0 0 0 3px rgba(255,26,26,0.08);
}
input:hover:not(:focus) { border-color: rgba(255,255,255,0.2); }

/* ── SUBMIT BUTTON ── */
.btn-submit {
  width: 100%; margin-top: 8px;
  padding: 15px;
  background: transparent;
  border: 1px solid rgba(255,26,26,0.5);
  border-radius: 2px;
  color: #fff;
  font-family: var(--font-head); font-size: 20px; letter-spacing: 4px;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: border-color .3s, box-shadow .3s;
}
.btn-submit::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--red);
  transform: scaleX(0); transform-origin: left;
  transition: transform .4s cubic-bezier(.4,0,.2,1);
}
.btn-submit:hover::before { transform: scaleX(1); }
.btn-submit:hover {
  border-color: var(--red);
  box-shadow: 0 0 30px rgba(255,26,26,0.3);
}
.btn-submit span { position: relative; z-index: 1; }

/* ── DIVIDER ── */
.divider {
  display: flex; align-items: center; gap: 16px;
  margin: 28px 0 24px;
}
.divider-line { flex: 1; height: 1px; background: var(--glass-border); }
.divider-text { font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

/* ── LINK ── */
.alt-link {
  text-align: center; font-size: 13px; color: var(--muted); letter-spacing: 1px;
}
.alt-link a {
  color: var(--red); text-decoration: none; font-weight: 700;
  transition: opacity .2s;
}
.alt-link a:hover { opacity: .7; }

/* ── SPEED STRIPE ── */
.speed-stripe {
  position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--red), #ff6b00, var(--red), transparent);
  background-size: 200% 100%;
  animation: stripeMove 3s linear infinite;
  z-index: 100;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes stripeMove {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
</style>
</head>
<body>

<div id="cursor-glow"></div>
<div id="cursor-dot"></div>
<div class="bg-grid"></div>

<nav>
  <a href="/" class="nav-logo">HOTWHEELS</a>
  <a href="/" class="nav-back">← Back to Home</a>
</nav>

<div class="page">
  <div class="card">
    <p class="card-eyebrow">Join the Crew</p>
    <h1 class="card-title">REGISTER</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}

      <div class="form-row">
        <div class="form-group half">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="name">
        </div>
        <div class="form-group half">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 00000 00000" required autocomplete="tel">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="location">Delivery Address</label>
        <input type="text" id="location" name="location" placeholder="Street, City, State" required autocomplete="street-address">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-submit">
        <span>Create Account →</span>
      </button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">Already racing?</span>
      <div class="divider-line"></div>
    </div>

    <p class="alt-link">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
  </div>
</div>

<div class="speed-stripe"></div>

<script>
(function(){
  const glow = document.getElementById('cursor-glow');
  const dot  = document.getElementById('cursor-dot');
  let mx = -300, my = -300, gx = -300, gy = -300;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx-3}px,${my-3}px)`;
  }, { passive: true });

  (function tick() {
    gx += (mx - gx) * 0.1;
    gy += (my - gy) * 0.1;
    glow.style.transform = `translate(${gx-180}px,${gy-180}px)`;
    requestAnimationFrame(tick);
  })();

  document.querySelectorAll('a, button, input').forEach(el => {
    el.addEventListener('mouseenter', () => { dot.style.width = dot.style.height = '12px'; dot.style.opacity = '.5'; });
    el.addEventListener('mouseleave', () => { dot.style.width = dot.style.height = '6px'; dot.style.opacity = '1'; });
  });
})();
</script>
</body>
</html>
