{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat · HotWheels</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #FF1A1A;
  --red-dim: rgba(255,26,26,0.12);
  --red-glow: rgba(255,26,26,0.4);
  --white: #ffffff;
  --off-white: rgba(255,255,255,0.85);
  --muted: rgba(255,255,255,0.45);
  --glass-bg: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
  --font-head: 'Bebas Neue', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
}

html, body {
  height: 100%;
  background: #000;
  color: var(--white);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── NOISE GRAIN ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.45;
}

/* ── CURSOR ── */
#cursor-glow {
  position: fixed; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,26,26,0.2) 0%, rgba(255,26,26,0.07) 40%, transparent 70%);
  pointer-events: none; z-index: 9998; top: 0; left: 0;
  will-change: transform; transform: translate(-150px,-150px);
}
#cursor-dot {
  position: fixed; width: 6px; height: 6px; border-radius: 50%;
  background: var(--red); pointer-events: none; z-index: 9999; top: 0; left: 0;
  will-change: transform; transform: translate(-3px,-3px);
  box-shadow: 0 0 8px var(--red);
  transition: width 0.2s, height 0.2s, opacity 0.2s;
}

/* ── LAYOUT ── */
.chat-shell {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh;
}

/* ── HEADER ── */
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 64px; flex-shrink: 0;
  background: rgba(0,0,0,0.8);
  border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
}
.chat-header-left { display: flex; align-items: center; gap: 16px; }
.chat-logo {
  font-family: var(--font-head); font-size: 22px; letter-spacing: 4px;
  color: var(--red); text-decoration: none;
  text-shadow: 0 0 16px rgba(255,26,26,0.4);
}
.chat-divider { width: 1px; height: 20px; background: var(--glass-border); }
.chat-title {
  font-family: var(--font-head); font-size: 18px; letter-spacing: 3px; color: var(--off-white);
}
.chat-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
}
.chat-badge-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--red);
  box-shadow: 0 0 8px var(--red);
  animation: pulse 2s infinite;
}

/* ── SPEED STRIPE ── */
.speed-stripe {
  height: 2px; flex-shrink: 0;
  background: linear-gradient(90deg, transparent, var(--red), #ff6b00, var(--red), transparent);
  background-size: 200% 100%;
  animation: stripeMove 3s linear infinite;
}

/* ── CHAT BOX ── */
#chatBox {
  flex: 1; overflow-y: auto;
  padding: 32px 24px;
  display: flex; flex-direction: column; gap: 16px;
  scroll-behavior: smooth;
}

/* scrollbar */
#chatBox::-webkit-scrollbar { width: 4px; }
#chatBox::-webkit-scrollbar-track { background: transparent; }
#chatBox::-webkit-scrollbar-thumb { background: rgba(255,26,26,0.3); border-radius: 4px; }

/* ── WELCOME ── */
.chat-welcome {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; flex: 1; gap: 12px;
  padding: 40px 0;
}
.chat-welcome-icon {
  font-size: 40px; opacity: 0.15;
  animation: floatIcon 3s ease-in-out infinite;
}
.chat-welcome-title {
  font-family: var(--font-head); font-size: 32px; letter-spacing: 4px; color: var(--off-white);
}
.chat-welcome-title span { color: var(--red); }
.chat-welcome-sub { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

/* ── MESSAGES ── */
.msg-row {
  display: flex; gap: 10px; align-items: flex-end;
  animation: fadeUp 0.25s ease forwards;
  opacity: 0;
}
.msg-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-size: 13px;
}
.msg-avatar.bot-av {
  background: var(--red-dim); border: 1px solid rgba(255,26,26,0.3); color: var(--red);
}
.msg-avatar.user-av {
  background: var(--red); color: #fff;
  box-shadow: 0 0 10px rgba(255,26,26,0.4);
}

.msg-bubble {
  max-width: 68%; padding: 12px 18px; border-radius: 2px;
  font-size: 14px; line-height: 1.75; letter-spacing: 0.3px;
  position: relative;
}

/* Bot bubble */
.msg-bubble.bot {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-left: 2px solid rgba(255,26,26,0.4);
  color: var(--off-white);
  border-radius: 0 4px 4px 0;
}
.msg-bubble.bot::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, var(--red), transparent);
}

/* User bubble */
.msg-bubble.user {
  background: var(--red);
  color: #fff;
  border-radius: 4px 0 0 4px;
  box-shadow: 0 4px 20px rgba(255,26,26,0.25);
}

.msg-time {
  font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,0.2);
  margin-top: 5px; text-align: right;
}
.msg-row.user .msg-time { text-align: left; }

/* ── TYPING ── */
.typing-row {
  display: flex; gap: 10px; align-items: center;
  animation: fadeUp 0.2s ease forwards; opacity: 0;
}
.typing-bubble {
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-left: 2px solid rgba(255,26,26,0.4);
  padding: 12px 18px; border-radius: 0 4px 4px 0;
  display: flex; gap: 5px; align-items: center;
}
.typing-bubble span {
  width: 5px; height: 5px; border-radius: 50%; background: var(--red);
  display: inline-block; opacity: 0;
  animation: typingBlink 1.4s infinite;
  box-shadow: 0 0 6px var(--red);
}
.typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

/* ── INPUT AREA ── */
.chat-input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--glass-border);
  padding: 20px 24px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(12px);
}

/* Quick prompts */
.quick-prompts {
  display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
}
.quick-btn {
  font-family: var(--font-body); font-size: 11px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  background: transparent; border: 1px solid var(--glass-border);
  color: var(--muted); padding: 5px 14px; border-radius: 2px; cursor: pointer;
  transition: all 0.2s;
}
.quick-btn:hover { border-color: rgba(255,26,26,0.4); color: var(--red); background: var(--red-dim); }

/* Input row */
.input-row {
  display: flex; gap: 12px; align-items: center;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 2px; padding: 4px 4px 4px 18px;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.input-row:focus-within {
  border-color: rgba(255,26,26,0.4);
  box-shadow: 0 0 0 3px rgba(255,26,26,0.06);
}
#userInput {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: var(--font-body); font-size: 15px; font-weight: 400;
  color: var(--white); letter-spacing: 0.3px;
}
#userInput::placeholder { color: var(--muted); }

.send-btn {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-head); font-size: 15px; letter-spacing: 2px;
  background: var(--red); color: #fff; border: none; cursor: pointer;
  padding: 10px 22px; border-radius: 2px;
  transition: background 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}
.send-btn:hover { background: #cc0000; box-shadow: 0 0 20px rgba(255,26,26,0.4); }
.send-btn:active { transform: scale(0.97); }
.send-btn svg { width: 14px; height: 14px; }

/* ── KEYFRAMES ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
@keyframes stripeMove {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes typingBlink {
  0%, 80%, 100% { opacity: 0; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}
@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
</style>
</head>
<body>

<div id="cursor-glow"></div>
<div id="cursor-dot"></div>

<div class="chat-shell">

  <!-- HEADER -->
  <header class="chat-header">
    <div class="chat-header-left">
      <a href="/" class="chat-logo">HOTWHEELS</a>
      <div class="chat-divider"></div>
      <div class="chat-title">AI CHAT</div>
    </div>
    <div class="chat-badge">
      <div class="chat-badge-dot"></div>
      Powered by Groq
    </div>
  </header>

  <div class="speed-stripe"></div>

  <!-- CHAT BOX -->
  <div id="chatBox">
    <div class="chat-welcome" id="welcomeScreen">
      <div class="chat-welcome-icon">⚡</div>
      <div class="chat-welcome-title">ASK THE <span>AI</span></div>
      <div class="chat-welcome-sub">Die-cast knowledge at full throttle</div>
    </div>
  </div>

  <!-- INPUT AREA -->
  <div class="chat-input-area">

    <!-- Quick prompts -->
    <div class="quick-prompts">
      <button class="quick-btn" onclick="quickSend('What are the best Hot Wheels models?')">Best Models</button>
      <button class="quick-btn" onclick="quickSend('How do I start collecting Hot Wheels?')">Start Collecting</button>
      <button class="quick-btn" onclick="quickSend('What is a Hot Wheels Treasure Hunt?')">Treasure Hunt</button>
      <button class="quick-btn" onclick="quickSend('Most valuable Hot Wheels ever made?')">Most Valuable</button>
    </div>

    <div class="input-row">
      <input
        id="userInput"
        type="text"
        placeholder="Ask anything about Hot Wheels..."
        autocomplete="off"
      >
      <button class="send-btn" onclick="sendMessage()">
        SEND
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

  </div>
</div>

<script>
/* ── CURSOR ── */
(function(){
  const glow = document.getElementById('cursor-glow');
  const dot  = document.getElementById('cursor-dot');
  let mx=-150, my=-150, gx=-150, gy=-150;
  document.addEventListener('mousemove', e=>{
    mx=e.clientX; my=e.clientY;
    dot.style.transform=`translate(${mx-3}px,${my-3}px)`;
  },{passive:true});
  (function tick(){
    gx+=(mx-gx)*0.1; gy+=(my-gy)*0.1;
    glow.style.transform=`translate(${gx-150}px,${gy-150}px)`;
    requestAnimationFrame(tick);
  })();
  document.querySelectorAll('button,input,a').forEach(el=>{
    el.addEventListener('mouseenter',()=>{dot.style.width=dot.style.height='12px';dot.style.opacity='0.6';});
    el.addEventListener('mouseleave',()=>{dot.style.width=dot.style.height='6px';dot.style.opacity='1';});
  });
})();

/* ── HELPERS ── */
const chatBox = document.getElementById('chatBox');
const welcomeScreen = document.getElementById('welcomeScreen');

function getTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function hideWelcome() {
  if (welcomeScreen) welcomeScreen.style.display = 'none';
}

function addMessage(text, sender) {
  hideWelcome();

  const row = document.createElement('div');
  row.classList.add('msg-row', sender);

  const av = document.createElement('div');
  av.classList.add('msg-avatar', sender === 'user' ? 'user-av' : 'bot-av');
  av.textContent = sender === 'user' ? 'U' : '⚡';

  const col = document.createElement('div');
  col.style.display = 'flex';
  col.style.flexDirection = 'column';
  col.style.maxWidth = '70%';

  const bubble = document.createElement('div');
  bubble.classList.add('msg-bubble', sender === 'user' ? 'user' : 'bot');
  bubble.textContent = text;

  const time = document.createElement('div');
  time.classList.add('msg-time');
  time.textContent = getTime();

  col.appendChild(bubble);
  col.appendChild(time);

  if (sender === 'user') {
    row.appendChild(col);
    row.appendChild(av);
  } else {
    row.appendChild(av);
    row.appendChild(col);
  }

  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  hideWelcome();
  const row = document.createElement('div');
  row.classList.add('typing-row');

  const av = document.createElement('div');
  av.classList.add('msg-avatar', 'bot-av');
  av.textContent = '⚡';

  const bubble = document.createElement('div');
  bubble.classList.add('typing-bubble');
  bubble.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(av);
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  return row;
}

function removeTyping(el) { if (el) el.remove(); }

/* ── SEND ── */
function sendMessage() {
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  input.value = '';

  const typingEl = showTyping();

  fetch("", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  })
  .then(res => res.json())
  .then(data => {
    removeTyping(typingEl);
    addMessage(data.response || "Something went wrong.", 'bot');
  })
  .catch(() => {
    removeTyping(typingEl);
    addMessage("Connection error. Please try again.", 'bot');
  });
}

function quickSend(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
